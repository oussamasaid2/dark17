<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10291f">
  <meta name="description" content="دارك - سوق عقارات ولاية الجلفة. ابحث واشترِ أو بع عقارك في بلديات ودواوير ولاية الجلفة.">
  <title>دارك | عقارات الجلفة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- AUTH_UI_START -->
  <dialog class="modal auth-modal" id="auth-modal" aria-labelledby="auth-title">
    <form method="dialog" class="modal-close-wrap"><button class="modal-close" aria-label="إغلاق">×</button></form>
    <div class="modal-body auth-modal-body">
      <div class="auth-brand" aria-hidden="true"><span>د</span></div>
      <p class="eyebrow">حسابك في دارك</p>
      <h2 id="auth-title">مرحبًا بعودتك</h2>
      <p class="auth-intro">سجّل الدخول لمتابعة إعلاناتك والتعليق على العقارات.</p>

      <div class="auth-tabs" role="tablist" aria-label="الدخول أو إنشاء حساب">
        <button type="button" class="auth-tab active" id="login-tab" role="tab" aria-selected="true" aria-controls="login-form" data-auth-view="login">تسجيل الدخول</button>
        <button type="button" class="auth-tab" id="register-tab" role="tab" aria-selected="false" aria-controls="register-form" data-auth-view="register">إنشاء حساب</button>
      </div>

      <form id="login-form" class="listing-form auth-form" novalidate aria-labelledby="login-tab">
        <label><span>رقم الهاتف</span>
          <input class="auth-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="32" dir="ltr" placeholder="07XX XX XX XX">
        </label>
        <label><span>كلمة المرور</span>
          <span class="password-field">
            <input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="8 أحرف على الأقل">
            <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
          </span>
        </label>
        <button class="cta-button auth-submit" type="submit"><span>دخول آمن</span></button>
        <a class="forgot-password" href="https://wa.me/213778249349" target="_blank" rel="noopener noreferrer">نسيت كلمة المرور؟ تواصل معنا على واتساب</a>
      </form>

      <form id="register-form" class="listing-form auth-form" novalidate hidden aria-labelledby="register-tab">
        <label><span>الاسم الكامل</span>
          <input name="name" autocomplete="name" maxlength="100" required placeholder="اكتب اسمك الكامل">
        </label>
        <label><span>رقم الهاتف</span>
          <input class="auth-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="32" dir="ltr" placeholder="07XX XX XX XX">
        </label>
        <label><span>كلمة المرور</span>
          <span class="password-field">
            <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="8 أحرف على الأقل">
            <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
          </span>
        </label>
        <button class="cta-button auth-submit" type="submit"><span>إنشاء الحساب</span></button>
      </form>

      <p class="form-status auth-status" id="auth-status" role="status" aria-live="polite"></p>
      <p class="auth-security"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg> نحفظ كلمة المرور مشفّرة ولا نعرضها لأحد.</p>
    </div>
  </dialog>
  <!-- AUTH_UI_END -->
  <script src="./script.js"></script>
</body>
</html>
